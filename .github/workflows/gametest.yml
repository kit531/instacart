name: gametest
on: [push, workflow_dispatch]

jobs:
  gametest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install xvfb + mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: run client game test
        run: |
          chmod +x ./gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon --stacktrace 2>&1 | tee gametest.log
      - name: summarize (annotations)
        if: always()
        run: |
          python3 - <<'PY'
          import re
          def esc(s): return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          log = [l[:300] for l in open('gametest.log', errors='replace').read().splitlines()]
          keys = re.compile(r'InstaCart|AssertionError|Exception in|Caused by: (?!java.lang.UnsatisfiedLink)|FAILED|\[ERROR\]|/ERROR\]|What went wrong|gametest|GameTest')
          sel = [l for l in log if keys.search(l) and 'flite' not in l and 'Narrator' not in l and 'phase ' not in l][:150]
          print('::notice title=InstaCart summary::' + esc('\n'.join(sel)[:30000]))
          tail = [l for l in log if not l.lstrip().startswith('at ')][-70:]
          print('::notice title=log tail::' + esc('\n'.join(tail)[:30000]))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-output
          path: |
            gametest.log
            build/run/clientGameTest/screenshots
